name: Build Debug APK & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-}"
          java -version

          JAVA_VERSION_LINE=$(java -version 2>&1 | head -n 1 || true)
          if [ -z "${JAVA_VERSION_LINE}" ]; then
            echo "::error::Unable to detect active Java version output."
            exit 1
          fi

          RAW_VERSION=$(echo "${JAVA_VERSION_LINE}" | sed -n 's/.*"\([^"]*\)".*/\1/p')
          if [ -z "${RAW_VERSION}" ]; then
            echo "::error::Failed to parse Java version from: ${JAVA_VERSION_LINE}"
            exit 1
          fi

          if [[ "${RAW_VERSION}" == 1.* ]]; then
            MAJOR_VERSION=$(echo "${RAW_VERSION}" | cut -d'.' -f2)
          else
            MAJOR_VERSION=$(echo "${RAW_VERSION}" | cut -d'.' -f1 | cut -d'-' -f1 | cut -d'+' -f1)
          fi

          if ! [[ "${MAJOR_VERSION}" =~ ^[0-9]+$ ]]; then
            echo "::error::Detected Java major version is not numeric: ${MAJOR_VERSION}"
            exit 1
          fi

          echo "Detected Java major version: ${MAJOR_VERSION}"
          if [ "${MAJOR_VERSION}" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java ${MAJOR_VERSION}."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "./debug.keystore" ]; then
            echo "Existing ./debug.keystore found; skipping generation."
          else
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [ ! -x "${KEYTOOL_BIN}" ]; then
              echo "::error::keytool not found in configured Java 17 installation (${JAVA_HOME})."
              exit 1
            fi

            "${KEYTOOL_BIN}" -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              >/dev/null 2>&1
          fi

          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "::error::Failed to create ./debug.keystore."
            exit 1
          fi
          echo "Temporary debug keystore is ready."

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -e "${EXPECTED_APK}" ]; then
            echo "::error::Expected debug APK not found at ${EXPECTED_APK}."
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' -print || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "::error::${EXPECTED_APK} exists but is not a regular file."
            exit 1
          fi

          if [ ! -s "${EXPECTED_APK}" ]; then
            echo "::error::${EXPECTED_APK} is empty."
            exit 1
          fi

          if [[ "${EXPECTED_APK}" != *.apk ]]; then
            echo "::error::${EXPECTED_APK} does not have the .apk extension."
            exit 1
          fi

          echo "Verified debug APK: ${EXPECTED_APK}"

      - name: Upload debug APK artifact
        id: upload_apk_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "${SOURCE_APK}" ] || [ ! -s "${SOURCE_APK}" ]; then
            echo "::error::Verified debug APK is missing or empty at ${SOURCE_APK}."
            exit 1
          fi

          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME=$(printf '%s' "${RAW_REPO_NAME}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9._-]+/-/g; s/-+/-/g; s/^-+//; s/-+$//')
          if [ -z "${SAFE_REPO_NAME}" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          ASSET_NAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TEMP_RELEASE_DIR=$(mktemp -d "${RUNNER_TEMP}/apk-release-asset.XXXXXX")
          ASSET_PATH="${TEMP_RELEASE_DIR}/${ASSET_NAME}"

          cp "${SOURCE_APK}" "${ASSET_PATH}"

          if [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ] || [[ "${ASSET_PATH}" != *.apk ]]; then
            echo "::error::Prepared release asset validation failed."
            exit 1
          fi

          echo "asset_path=${ASSET_PATH}" >> "${GITHUB_OUTPUT}"
          echo "asset_name=${ASSET_NAME}" >> "${GITHUB_OUTPUT}"
          echo "Prepared release asset filename: ${ASSET_NAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_release_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
        run: |
          set -euo pipefail
          gh --version

          if [ -z "${ASSET_PATH}" ] || [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ] || [[ "${ASSET_PATH}" != *.apk ]]; then
            echo "::error::Prepared APK release asset is invalid or missing; aborting release creation."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "release_title=${RELEASE_TITLE}" >> "${GITHUB_OUTPUT}"

          RELEASE_NOTES=$(cat <<EOF
          This is an automatically generated debug APK built by GitHub Actions.

          - **Workflow Run Number:** ${GITHUB_RUN_NUMBER}
          - **Workflow Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** ${GITHUB_SHA}
          - **APK Asset:** ${ASSET_NAME}

          > **Testing Only:** This APK is intended for testing and is not a Play Store production release. It is signed only with a temporary debug keystore.
          EOF
          )

          gh release create "${RELEASE_TAG}" "${ASSET_PATH}" \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_TITLE}" \
            --notes "${RELEASE_NOTES}" \
            --latest

      - name: Report APK download result
        if: ${{ !cancelled() && steps.publish_release.outcome != 'skipped' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          RELEASE_TAG: ${{ steps.publish_release.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.publish_release.outputs.release_title }}
          ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
        run: |
          set -euo pipefail
          if [ "${PUBLISH_OUTCOME}" = "success" ]; then
            RELEASE_URL=$(gh release view "${RELEASE_TAG}" --json url --jq '.url' 2>/dev/null || true)
            if [ -n "${RELEASE_URL}" ]; then
              echo "GitHub Release published successfully."
              echo "Release tag: ${RELEASE_TAG}"
              echo "Release title: ${RELEASE_TITLE}"
              echo "Release URL: ${RELEASE_URL}"
              echo "APK asset filename: ${ASSET_NAME}"

              {
                echo "## Debug APK Build & Release Summary"
                echo ""
                echo "- **Status:** APK build, Actions artifact upload, and GitHub Release publishing succeeded."
                echo "- **Release Title:** ${RELEASE_TITLE}"
                echo "- **Release Tag:** \`${RELEASE_TAG}\`"
                echo "- **APK Asset Filename:** \`${ASSET_NAME}\`"
                echo "- **GitHub Release Page:** ${RELEASE_URL}"
                echo ""
                echo "Download \`${ASSET_NAME}\` directly from the release **Assets** section on your phone."
                echo "The normal GitHub Actions artifact \`app-debug-apk\` is also available as a backup."
              } >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
          fi

          echo "::warning::GitHub Release publishing did not complete, but the debug APK build succeeded and the Actions artifact 'app-debug-apk' remains available."
          {
            echo "## Debug APK Build Summary (Release Publishing Warning)"
            echo ""
            echo "> **Warning:** Publishing to GitHub Releases failed or could not be verified."
            echo ""
            echo "- **APK Build Status:** Succeeded"
            echo "- **Backup Actions Artifact:** \`app-debug-apk\` remains uploaded and available in this workflow run."
            echo "- **Next Step:** Download \`app-debug-apk\` from the **Artifacts** section of this workflow run."
          } >> "${GITHUB_STEP_SUMMARY}"
